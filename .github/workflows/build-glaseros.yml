
name: Build GLASER OS Neon Cyber

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build GLASER OS ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install Git
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Download Kali live-build framework
        run: |
          git clone --depth 1 \
            https://gitlab.com/kalilinux/build-scripts/kali-live.git

      - name: Configure GLASER OS packages
        run: |
          cd kali-live
          mkdir -p kali-config/variant-xfce/package-lists

          cat > kali-config/variant-xfce/package-lists/glaseros.list.chroot <<'EOF'
          nmap
          wireshark
          tcpdump
          whois
          dnsutils
          curl
          git
          python3
          python3-tk
          python3-psutil
          firefox-esr
          xfce4-terminal
          xfce4-taskmanager
          thunar
          network-manager
          xterm
          EOF

      - name: Create GLASER OS desktop dashboard
        run: |
          cd kali-live

          APP="kali-config/common/includes.chroot"
          mkdir -p "$APP/usr/local/share/glaseros"
          mkdir -p "$APP/usr/local/bin"
          mkdir -p "$APP/usr/share/applications"
          mkdir -p "$APP/etc/xdg/autostart"

          cat > "$APP/usr/local/share/glaseros/dashboard.py" <<'PYTHON'
          import tkinter as tk
          import subprocess
          import shutil
          import time

          try:
              import psutil
          except ImportError:
              psutil = None

          BG = "#080b12"
          PANEL = "#101827"
          CYAN = "#00f5ff"
          GREEN = "#39ff88"
          WHITE = "#e8faff"
          MUTED = "#8aa4b5"

          root = tk.Tk()
          root.title("GLASER OS - NEON CYBER")
          root.geometry("1050x700")
          root.minsize(780, 520)
          root.configure(bg=BG)

          tk.Label(
              root, text="GLASER OS", bg=BG, fg=CYAN,
              font=("TkDefaultFont", 30, "bold")
          ).pack(anchor="w", padx=30, pady=(25, 0))

          tk.Label(
              root, text="NEON CYBER  |  YOUR SYSTEM. YOUR NETWORK.",
              bg=BG, fg=GREEN, font=("TkDefaultFont", 11, "bold")
          ).pack(anchor="w", padx=32, pady=(5, 20))

          stats = tk.Frame(root, bg=BG)
          stats.pack(fill="x", padx=25)

          def make_stat(title):
              panel = tk.Frame(stats, bg=PANEL, padx=18, pady=15)
              panel.pack(side="left", expand=True, fill="x", padx=5)
              tk.Label(
                  panel, text=title, bg=PANEL, fg=MUTED
              ).pack(anchor="w")
              value = tk.Label(
                  panel, text="Starting...", bg=PANEL, fg=CYAN,
                  font=("TkDefaultFont", 20, "bold")
              )
              value.pack(anchor="w", pady=(8, 0))
              return value

          cpu = make_stat("CPU USAGE")
          memory = make_stat("MEMORY USAGE")
          network = make_stat("NETWORK TRAFFIC")

          tk.Label(
              root, text="SYSTEM TOOLKIT", bg=BG, fg=WHITE,
              font=("TkDefaultFont", 16, "bold")
          ).pack(anchor="w", padx=30, pady=(28, 12))

          grid = tk.Frame(root, bg=BG)
          grid.pack(fill="x", padx=25)

          def launch(program, args=None):
              if shutil.which(program):
                  try:
                      subprocess.Popen([program] + (args or []))
                  except Exception as exc:
                      status.config(text=f"Launch error: {exc}")
              else:
                  status.config(text=f"{program} is not installed.")

          def add_tool(title, description, callback):
              card = tk.Frame(
                  grid, bg=PANEL, padx=15, pady=15,
                  highlightbackground="#174253",
                  highlightthickness=1
              )
              card.pack(
                  side="left", expand=True, fill="both",
                  padx=5, pady=5
              )
              tk.Label(
                  card, text=title, bg=PANEL, fg=CYAN,
                  font=("TkDefaultFont", 13, "bold")
              ).pack(anchor="w")
              tk.Label(
                  card, text=description, bg=PANEL, fg=MUTED,
                  wraplength=180, justify="left"
              ).pack(anchor="w", pady=10)
              tk.Button(
                  card, text="OPEN", command=callback,
                  bg="#123443", fg=WHITE, relief="flat",
                  padx=12, pady=7
              ).pack(anchor="w")

          add_tool(
              "TERMINAL", "Run Linux commands.",
              lambda: launch("xfce4-terminal")
          )
          add_tool(
              "NETWORK SCAN", "Scan networks you own or have permission to test.",
              lambda: launch("xfce4-terminal", ["--hold", "-e", "nmap"])
          )
          add_tool(
              "WIRESHARK", "Inspect authorized network traffic.",
              lambda: launch("wireshark")
          )
          add_tool(
              "WEB BROWSER", "Browse the web.",
              lambda: launch("firefox-esr")
          )

          grid2 = tk.Frame(root, bg=BG)
          grid2.pack(fill="x", padx=25)

          def add_second(title, description, callback):
              card = tk.Frame(
                  grid2, bg=PANEL, padx=15, pady=12,
                  highlightbackground="#174253",
                  highlightthickness=1
              )
              card.pack(
                  side="left", expand=True, fill="both",
                  padx=5, pady=5
              )
              tk.Label(
                  card, text=title, bg=PANEL, fg=GREEN,
                  font=("TkDefaultFont", 12, "bold")
              ).pack(anchor="w")
              tk.Label(
                  card, text=description, bg=PANEL, fg=MUTED,
                  wraplength=180, justify="left"
              ).pack(anchor="w", pady=8)
              tk.Button(
                  card, text="OPEN", command=callback,
                  bg="#17352b", fg=WHITE, relief="flat",
                  padx=12, pady=6
              ).pack(anchor="w")

          add_second(
              "FILES", "Browse files and folders.",
              lambda: launch("thunar")
          )
          add_second(
              "SYSTEM MONITOR", "Inspect running processes.",
              lambda: launch("xfce4-taskmanager")
          )
          add_second(
              "NETWORK INFO", "View network interfaces.",
              lambda: launch("xfce4-terminal", ["--hold", "-e", "ip", "address"])
          )
          add_second(
              "DNS TOOLS", "Open a terminal for DNS lookups.",
              lambda: launch("xfce4-terminal")
          )

          status = tk.Label(
              root, text="GLASER OS | INITIALIZING",
              bg=BG, fg=GREEN
          )
          status.pack(anchor="w", padx=32, pady=(18, 4))

          tk.Label(
              root, text="AUTHORIZED SECURITY TESTING ONLY",
              bg=BG, fg=MUTED
          ).pack(anchor="w", padx=32, pady=(0, 15))

          previous = None

          def refresh():
              global previous
              try:
                  if psutil:
                      cpu.config(text=f"{psutil.cpu_percent()}%")
                      memory.config(
                          text=f"{psutil.virtual_memory().percent}%"
                      )
                      current = psutil.net_io_counters()
                      if previous is None:
                          network.config(text="Monitoring")
                      else:
                          amount = (
                              current.bytes_sent - previous.bytes_sent
                              + current.bytes_recv - previous.bytes_recv
                          )
                          network.config(text=f"{max(0, amount)//1024} KB")
                      previous = current
                      status.config(
                          text="GLASER OS | LIVE | "
                          + time.strftime("%H:%M:%S")
                      )
              except Exception:
                  status.config(text="GLASER OS | MONITOR UNAVAILABLE")
              root.after(1500, refresh)

          refresh()
          root.mainloop()
          PYTHON

          cat > "$APP/usr/local/bin/glaseros-dashboard" <<'EOF'
          #!/bin/sh
          exec python3 /usr/local/share/glaseros/dashboard.py
          EOF

          chmod +x "$APP/usr/local/bin/glaseros-dashboard"

          cat > "$APP/usr/share/applications/glaseros-dashboard.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=GLASER OS Dashboard
          Comment=Neon Cyber System Dashboard
          Exec=/usr/local/bin/glaseros-dashboard
          Icon=utilities-terminal
          Terminal=false
          Categories=System;Security;
          EOF

          cat > "$APP/etc/xdg/autostart/glaseros.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=GLASER OS Dashboard
          Exec=/usr/local/bin/glaseros-dashboard
          Terminal=false
          EOF

          cat > "$APP/etc/issue" <<'EOF'

          ==========================================
                 GLASER OS - NEON CYBER
          ==========================================
          Custom bootable Linux desktop
          Authorized security testing only.
          ==========================================

          EOF

      - name: Build ISO inside Kali Linux container
        run: |
          docker pull kalilinux/kali-rolling

          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE/kali-live:/work" \
            -w /work \
            kalilinux/kali-rolling \
            bash -lc '
              set -eux
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build \
                cdebootstrap \
                debootstrap \
                sudo \
                git \
                curl \
                ca-certificates \
                xorriso \
                squashfs-tools \
                kali-archive-keyring \
                debian-archive-keyring \
                rsync \
                dosfstools \
                mtools
              echo "Installed live-build version:"
              dpkg-query -W live-build
              ./build.sh --variant xfce --arch amd64 --hostname glaseros --version 0.1
            '

      - name: Find and prepare bootable ISO
        run: |
          mkdir -p dist

          ISO="$(find kali-live -type f -name '*.iso' \
            -not -path '*/dist/*' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO was generated."
            echo "Build output files:"
            find kali-live -maxdepth 4 -type f | head -200
            exit 1
          fi

          cp "$ISO" dist/GLASER-OS-Neon-Cyber-amd64.iso
          sha256sum dist/GLASER-OS-Neon-Cyber-amd64.iso \
            > dist/SHA256SUMS.txt

          ls -lh dist/

      - name: Upload GLASER OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: GLASER-OS-Neon-Cyber-ISO
          path: dist/
          if-no-files-found: error
          retention-days: 7
