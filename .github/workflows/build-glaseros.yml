
name: Build GLASER OS Neon Cyber

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build bootable GLASER OS ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            live-build \
            cdebootstrap \
            curl \
            ca-certificates \
            xorriso \
            squashfs-tools \
            debian-archive-keyring \
            rsync \
            dosfstools \
            mtools \
            debootstrap

      - name: Download Kali live-build framework
        run: |
          git clone --depth 1 \
            https://gitlab.com/kalilinux/build-scripts/kali-live.git
          cd kali-live
          chmod +x build.sh

      - name: Configure GLASER OS packages
        run: |
          cd kali-live
          mkdir -p kali-config/variant-xfce/package-lists

          cat > kali-config/variant-xfce/package-lists/glaseros.list.chroot <<'EOF'
          nmap
          wireshark
          tcpdump
          whois
          dnsutils
          curl
          git
          python3
          python3-tk
          python3-psutil
          firefox-esr
          xfce4-terminal
          xfce4-taskmanager
          thunar
          network-manager
          xterm
          EOF

      - name: Create native GLASER OS desktop
        run: |
          cd kali-live

          APPDIR="kali-config/common/includes.chroot/usr/local/share/glaseros"
          BINDIR="kali-config/common/includes.chroot/usr/local/bin"
          DESKTOPDIR="kali-config/common/includes.chroot/usr/share/applications"
          AUTOSTARTDIR="kali-config/common/includes.chroot/etc/xdg/autostart"

          mkdir -p "$APPDIR" "$BINDIR" "$DESKTOPDIR" "$AUTOSTARTDIR"

          cat > "$APPDIR/dashboard.py" <<'PYTHON'
          import tkinter as tk
          from tkinter import messagebox
          import subprocess
          import shutil
          import os
          import time

          try:
              import psutil
          except ImportError:
              psutil = None

          BG = "#080b12"
          PANEL = "#101827"
          NEON = "#00f5ff"
          GREEN = "#39ff88"
          TEXT = "#e8faff"
          MUTED = "#8aa4b5"

          root = tk.Tk()
          root.title("GLASER OS | NEON CYBER")
          root.geometry("1100x720")
          root.minsize(800, 560)
          root.configure(bg=BG)

          def launch(command):
              executable = command[0]
              if shutil.which(executable):
                  try:
                      subprocess.Popen(command)
                  except Exception as exc:
                      messagebox.showerror("Launch error", str(exc))
              else:
                  messagebox.showwarning(
                      "Application unavailable",
                      executable + " is not installed or is not in PATH."
                  )

          header = tk.Frame(root, bg=BG)
          header.pack(fill="x", padx=28, pady=(22, 10))

          tk.Label(
              header, text="GLASER", bg=BG, fg=NEON,
              font=("TkDefaultFont", 30, "bold")
          ).pack(side="left")

          tk.Label(
              header, text="OS  /  NEON CYBER",
              bg=BG, fg=GREEN, font=("TkDefaultFont", 13, "bold")
          ).pack(side="left", padx=18, pady=(12, 0))

          tk.Label(
              root,
              text="YOUR SYSTEM. YOUR NETWORK. YOUR TOOLS.",
              bg=BG, fg=MUTED, font=("TkDefaultFont", 11)
          ).pack(anchor="w", padx=32, pady=(0, 18))

          stats = tk.Frame(root, bg=BG)
          stats.pack(fill="x", padx=24, pady=4)

          def stat_card(title):
              card = tk.Frame(stats, bg=PANEL, padx=18, pady=15)
              card.pack(side="left", expand=True, fill="x", padx=5)
              tk.Label(
                  card, text=title, bg=PANEL, fg=MUTED,
                  font=("TkDefaultFont", 10, "bold")
              ).pack(anchor="w")
              value = tk.Label(
                  card, text="Reading...", bg=PANEL, fg=NEON,
                  font=("TkDefaultFont", 22, "bold")
              )
              value.pack(anchor="w", pady=(8, 0))
              return value

          cpu_value = stat_card("CPU LOAD")
          ram_value = stat_card("MEMORY")
          net_value = stat_card("NETWORK")

          section = tk.Frame(root, bg=BG)
          section.pack(fill="x", padx=30, pady=(26, 10))

          tk.Label(
              section, text="CYBER TOOLKIT", bg=BG, fg=TEXT,
              font=("TkDefaultFont", 16, "bold")
          ).pack(anchor="w", pady=(0, 12))

          tools_frame = tk.Frame(root, bg=BG)
          tools_frame.pack(fill="x", padx=24)

          def tool_button(title, description, command):
              frame = tk.Frame(
                  tools_frame, bg=PANEL, padx=14, pady=13,
                  highlightbackground="#183b4b", highlightthickness=1
              )
              frame.pack(side="left", expand=True, fill="both", padx=5, pady=5)

              tk.Label(
                  frame, text=title, bg=PANEL, fg=NEON,
                  font=("TkDefaultFont", 13, "bold")
              ).pack(anchor="w")

              tk.Label(
                  frame, text=description, bg=PANEL, fg=MUTED,
                  wraplength=180, justify="left",
                  font=("TkDefaultFont", 9)
              ).pack(anchor="w", pady=8)

              tk.Button(
                  frame, text="LAUNCH", command=command,
                  bg="#123443", fg=TEXT, activebackground=NEON,
                  activeforeground=BG, relief="flat",
                  padx=10, pady=7, cursor="hand2"
              ).pack(anchor="w", pady=(4, 0))

          tool_button(
              "TERMINAL", "Run Linux commands and scripts.",
              lambda: launch(["xfce4-terminal"])
          )
          tool_button(
              "NETWORK SCAN", "Inspect devices on networks you own or are authorized to test.",
              lambda: launch(["xfce4-terminal", "--hold", "-e", "nmap"])
          )
          tool_button(
              "WIRESHARK", "Analyze network traffic with permission.",
              lambda: launch(["wireshark"])
          )
          tool_button(
              "WEB BROWSER", "Open the web.",
              lambda: launch(["firefox-esr"])
          )

          tools_frame2 = tk.Frame(root, bg=BG)
          tools_frame2.pack(fill="x", padx=24)

          def second_button(title, description, command):
              frame = tk.Frame(
                  tools_frame2, bg=PANEL, padx=14, pady=13,
                  highlightbackground="#183b4b", highlightthickness=1
              )
              frame.pack(side="left", expand=True, fill="both", padx=5, pady=5)

              tk.Label(
                  frame, text=title, bg=PANEL, fg=GREEN,
                  font=("TkDefaultFont", 12, "bold")
              ).pack(anchor="w")

              tk.Label(
                  frame, text=description, bg=PANEL, fg=MUTED,
                  wraplength=180, justify="left",
                  font=("TkDefaultFont", 9)
              ).pack(anchor="w", pady=8)

              tk.Button(
                  frame, text="OPEN", command=command,
                  bg="#17352b", fg=TEXT, activebackground=GREEN,
                  activeforeground=BG, relief="flat",
                  padx=10, pady=7, cursor="hand2"
              ).pack(anchor="w", pady=(4, 0))

          second_button(
              "FILE MANAGER", "Browse files and folders.",
              lambda: launch(["thunar"])
          )
          second_button(
              "SYSTEM MONITOR", "View running processes and system load.",
              lambda: launch(["xfce4-taskmanager"])
          )
          second_button(
              "NETWORK INFO", "View this computer's network interfaces.",
              lambda: launch(["xfce4-terminal", "--hold", "-e", "ip address"])
          )
          second_button(
              "DNS LOOKUP", "Look up a domain using the system resolver.",
              lambda: launch(["xfce4-terminal", "--hold", "-e", "bash"])
          )

          status = tk.Label(
              root, text="GLASER OS | SYSTEM INITIALIZING",
              bg=BG, fg=GREEN, font=("TkDefaultFont", 10)
          )
          status.pack(anchor="w", padx=32, pady=(18, 8))

          footer = tk.Label(
              root, text="AUTHORIZED SECURITY TESTING ONLY",
              bg=BG, fg=MUTED, font=("TkDefaultFont", 9)
          )
          footer.pack(anchor="w", padx=32, pady=(0, 14))

          last_net = None

          def refresh():
              global last_net
              try:
                  if psutil:
                      cpu_value.config(text=f"{psutil.cpu_percent()}%")
                      mem = psutil.virtual_memory()
                      ram_value.config(text=f"{mem.percent}%")
                      net = psutil.net_io_counters()
                      if last_net is None:
                          net_value.config(text="Monitoring")
                      else:
                          total = (
                              net.bytes_sent - last_net.bytes_sent
                              + net.bytes_recv - last_net.bytes_recv
                          )
                          net_value.config(text=f"{max(total, 0) // 1024} KB")
                      last_net = net
                      status.config(
                          text="GLASER OS | LIVE SYSTEM MONITORING | "
                               + time.strftime("%H:%M:%S")
                      )
                  else:
                      status.config(text="GLASER OS | SYSTEM MONITORING UNAVAILABLE")
              except Exception:
                  status.config(text="GLASER OS | MONITOR UPDATE FAILED")
              root.after(1500, refresh)

          refresh()
          root.mainloop()
          PYTHON

          cat > "$BINDIR/glaseros-dashboard" <<'SH'
          #!/bin/sh
          exec python3 /usr/local/share/glaseros/dashboard.py
          SH
          chmod +x "$BINDIR/glaseros-dashboard"

          cat > "$DESKTOPDIR/glaseros-dashboard.desktop" <<'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=GLASER OS Dashboard
          Comment=GLASER OS Neon Cyber desktop dashboard
          Exec=/usr/local/bin/glaseros-dashboard
          Icon=utilities-terminal
          Terminal=false
          Categories=System;Security;
          DESKTOP

          cat > "$AUTOSTARTDIR/glaseros.desktop" <<'AUTOSTART'
          [Desktop Entry]
          Type=Application
          Name=GLASER OS Dashboard
          Exec=/usr/local/bin/glaseros-dashboard
          Terminal=false
          AUTOSTART

          mkdir -p kali-config/common/includes.chroot/etc
          cat > kali-config/common/includes.chroot/etc/issue <<'ISSUE'

          ==========================================
                    GLASER OS - NEON CYBER
          ==========================================
          Custom live Linux desktop and cyber toolkit
          Use security tools only with authorization.
          ==========================================

          ISSUE

      - name: Build bootable GLASER OS ISO
        run: |
          cd kali-live
          sudo ./build.sh --variant xfce --arch amd64 --hostname glaseros --version 0.1

      - name: Locate and prepare ISO
        run: |
          mkdir -p dist
          ISO="$(find kali-live -type f -name '*.iso' -not -path '*/dist/*' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: Build finished but no ISO file was found."
            echo "Files generated by the build:"
            find kali-live -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Found ISO: $ISO"
          cp "$ISO" dist/glaseros-neon-cyber-amd64.iso
          sha256sum dist/glaseros-neon-cyber-amd64.iso > dist/SHA256SUMS.txt
          ls -lh dist/

      - name: Upload bootable GLASER OS
        uses: actions/upload-artifact@v4
        with:
          name: GLASER-OS-Neon-Cyber-ISO
          path: dist/
          if-no-files-found: error
          retention-days: 7
